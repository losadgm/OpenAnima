name: Dependency graph

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The dependency submission API needs write access to the repository.
permissions:
  contents: write

jobs:
  submit:
    name: Submit CMake dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build snapshot
        run: python3 .github/scripts/cmake_dependency_snapshot.py --output snapshot.json

      - name: Submit snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --data-binary @snapshot.json
