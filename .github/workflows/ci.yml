name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Debug, Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang ninja-build

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"
          ninjaVersion: "^1.11.1"

      - name: Configure (Ubuntu / clang)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test (CTest)
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  # The reference is part of the product, so it is built on every change and not only
  # when the site is published.
  docs:
    name: ubuntu-latest / docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Doxygen and pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y doxygen ninja-build pandoc

      # curl and the tests have nothing to do with reading the headers, and skipping
      # them keeps the job from fetching the dependencies.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DBUILD_TESTING=OFF
          -DOPENANIMA_WITH_CURL=OFF
          -DOPENANIMA_ENABLE_DOCS=ON

      # A missing @param or an undocumented type fails the job here instead of quietly
      # shipping a reference with holes in it.
      - name: Treat Doxygen warnings as errors
        run: sed -i 's/^WARN_AS_ERROR * = .*/WARN_AS_ERROR = YES/' build/Doxyfile

      - name: Build the API reference
        run: cmake --build build --target docs

      - name: Build the site
        run: bash docs/build-docs.sh
