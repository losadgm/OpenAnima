# Builds the documentation site and publishes it to GitHub Pages.
#
# Both halves come from this branch: the pages are the Markdown files in docs/, and the
# API reference is generated by Doxygen from the headers in include/. There is no second
# copy of the documentation to keep in sync.
name: Deploy documentation to Pages

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install documentation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y doxygen ninja-build pandoc
          doxygen --version
          pandoc --version | head -1

      # curl and the tests are not needed to read the headers, and skipping them keeps
      # the job from fetching the dependencies.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DBUILD_TESTING=OFF
          -DOPENANIMA_WITH_CURL=OFF
          -DOPENANIMA_ENABLE_DOCS=ON

      - name: Build the API reference
        run: cmake --build build --target docs

      - name: Build the site
        run: bash docs/build-docs.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "build/site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
