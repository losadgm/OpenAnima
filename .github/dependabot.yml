# Dependabot configuration for OpenAnima.
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# NOTE: C++ dependencies declared in CMakeLists.txt via FetchContent
# (nlohmann_json, Catch2) are NOT tracked here: Dependabot has no `cmake`
# or `cpp` ecosystem, so their GIT_TAG pins stay manual. To automate those
# updates, use Renovate (custom regex manager over CMakeLists.txt) or a
# vcpkg manifest (`vcpkg.json`, which Dependabot does support).
version: 2
updates:
  # Keep the GitHub Actions used in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
